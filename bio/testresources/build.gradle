void createDbInternal(dbName) {
    println 'Creating database ' + dbName
    def resultStream = new ByteArrayOutputStream()
    exec {
        ignoreExitValue true
        environment PGPASSWORD: "postgres"
        commandLine 'sudo', '-E', '-u', 'postgres', 'psql', '-h', 'localhost', '-c', "create database \"" + dbName + "\";"
        standardOutput = resultStream
        errorOutput = resultStream
    }

    def result = resultStream.toString().trim()

    if (result.contains('database "' + dbName + '" already exists')) {
        println 'Already exists.'
    } else if (result.contains("CREATE DATABASE")) {
        println 'Created.'
    } else {
        throw new GradleException("FAILED:\n${result}")
    }
}

void grantPrivileges(dbName) {
    println 'Grant privileges on database ' + dbName
    def resultStream = new ByteArrayOutputStream()
    exec {
        ignoreExitValue true
        environment PGPASSWORD: "postgres"
        commandLine 'sudo', '-E', '-u', 'postgres', 'psql', '-h', 'localhost', '-c', "grant all privileges on database \"" + dbName + "\" to test;"
        standardOutput = resultStream
        errorOutput = resultStream
    }

    def result = resultStream.toString().trim()

    if (result.contains("GRANT")) {
        println 'Granted.'
    } else {
        throw new GradleException("FAILED:\n${result}")
    }

}

task createUnitTestDatabases {
    description "create databases needed for unit tests"
    doLast {
        // fail if DB is already there. Instead we could read in the list of DBs and only
        // create ones that aren't there
        createDbInternal('bio-test')
        grantPrivileges('bio-test')
        createDbInternal('bio-fulldata-test')
        grantPrivileges('bio-fulldata-test')
    }
}
